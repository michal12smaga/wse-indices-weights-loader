[project]
name = "wse-indices-weights-loader"
version = "0.1.0"
description = "A Python tool for downloading and parsing PDF files containing stock index composition data from the Warsaw Stock Exchange (WSE)."
authors = [{ name = "Stefan Konopnicki", email = "stefan.konopnicki@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.5",
  "pandas>=2.3.2",
  "pdfplumber>=0.11.7",
  "requests>=2.32.5",
]

[project.urls]
Repository = "https://github.com/skonop/wse-indices-weights-loader"
Issues = "https://github.com/skonop/wse-indices-weights-loader/issues"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "black~=24.0",
]
