name: Screen four manually mapped WIG symbols

on:
  push:
    branches: [chatgpt-gpw-research]
    paths:
      - ".github/workflows/screen-four-unmapped.yml"

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Screen
        shell: bash
        run: |
          pip install pandas requests
          python - <<'PY'
          import requests,pandas as pd
          s=requests.Session();s.headers.update({"User-Agent":"Mozilla/5.0"})
          syms=["GRX.WA","KRK.WA","MOL.WA","PLZ.WA"]
          p1=int(pd.Timestamp("2025-06-01",tz="UTC").timestamp())
          p2=int(pd.Timestamp("2026-09-29",tz="UTC").timestamp())
          for sym in syms:
              r=s.get(f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}",
                    params={"period1":p1,"period2":p2,"interval":"1d","events":"div,splits"},timeout=20)
              o=r.json()["chart"]["result"][0];q=o["indicators"]["quote"][0]
              d=pd.DataFrame({"date":pd.to_datetime(o["timestamp"],unit="s",utc=True),
                              "close":q["close"],"volume":q["volume"]}).dropna(subset=["close"])
              d=d[d.date<pd.Timestamp("2026-09-29",tz="UTC")]
              close=float(d.close.iloc[-1]); sma=float(d.close.tail(200).mean())
              mom=float(close/d.close.iloc[-253]-1)
              adv=float((d.close.tail(60)*d.volume.tail(60)).median())
              print(sym,{"close":close,"sma200":sma,"mom12":mom,"adv60":adv,
                         "ok":close>sma and mom>0 and adv>=1_000_000})
          PY
