name: Build current WIG Top10 signal

on:
  push:
    branches: [chatgpt-gpw-research]
    paths:
      - ".github/workflows/current-top10.yml"

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-gpw-research

      - name: Install dependencies
        run: pip install pandas requests beautifulsoup4

      - name: Build signal from current Money/Notoria WIG universe
        shell: bash
        run: |
          python - <<'PY'
          import json, math, re, time, requests
          import pandas as pd
          import numpy as np
          from pathlib import Path

          OUT=Path("live_signal_current")
          OUT.mkdir(exist_ok=True)
          sess=requests.Session()
          sess.headers.update({"User-Agent":"Mozilla/5.0"})

          # Current WIG membership from Money.pl / NOTORIA server-rendered page state.
          url="https://www.money.pl/gielda/indeksy_gpw/wig/"
          html=sess.get(url,timeout=30).text
          marker='"stockData":'
          pos=html.find(marker)
          if pos<0:
              raise RuntimeError("stockData not found on current WIG page")
          arr_start=html.find("[",pos)
          stock_data,end=json.JSONDecoder().raw_decode(html[arr_start:])
          print("CURRENT_WIG_MEMBERS",len(stock_data))

          members=[]
          for x in stock_data:
              href=x.get("url_rel","")
              m=re.search(r'/([a-z0-9]{12})\.html$',href,re.I)
              if not m:
                  continue
              members.append({
                  "company_name":x.get("name"),
                  "isin":m.group(1).upper(),
                  "money_value":x.get("value"),
                  "index_share_pct":x.get("index_share"),
                  "money_url":"https://www.money.pl"+href,
              })
          mp=pd.DataFrame(members).drop_duplicates("isin")
          print("CURRENT_WIG_WITH_ISIN",len(mp))
          mp.to_csv(OUT/"current_wig_members.csv",index=False)

          # Map WIG ISINs to Yahoo Warsaw symbols.
          maps=[]
          for i,r in mp.iterrows():
              candidates=[]
              for q in [r["isin"],r["company_name"]]:
                  try:
                      rr=sess.get("https://query1.finance.yahoo.com/v1/finance/search",
                                  params={"q":q,"quotesCount":10,"newsCount":0},timeout=20)
                      if rr.ok:
                          for z in rr.json().get("quotes",[]):
                              if str(z.get("symbol","")).endswith(".WA"):
                                  candidates.append(z)
                      if candidates: break
                  except Exception as e:
                      print("MAP_ERR",r["company_name"],repr(e))
                  time.sleep(.03)
              best=candidates[0] if candidates else {}
              maps.append({
                  **r.to_dict(),
                  "symbol":best.get("symbol"),
                  "yahoo_name":best.get("longname") or best.get("shortname")
              })
              if (i+1)%50==0: print("MAP_PROGRESS",i+1)
              time.sleep(.05)

          maps=pd.DataFrame(maps)
          maps.to_csv(OUT/"current_wig_yahoo_mapping.csv",index=False)
          print("MAPPED",maps["symbol"].notna().sum(),"OF",len(maps))

          signal_date=pd.Timestamp("2026-09-28")
          p1=int(pd.Timestamp("2025-06-01",tz="UTC").timestamp())
          p2=int(pd.Timestamp("2026-09-29",tz="UTC").timestamp())
          rows=[]
          for _,r in maps.dropna(subset=["symbol"]).iterrows():
              sym=r["symbol"]
              try:
                  rr=sess.get(f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}",
                    params={"period1":p1,"period2":p2,"interval":"1d","events":"div,splits","includeAdjustedClose":"true"},
                    timeout=25)
                  rr.raise_for_status()
                  obj=rr.json()["chart"]["result"][0]
                  ts=obj.get("timestamp") or []
                  q=obj["indicators"]["quote"][0]
                  data=pd.DataFrame({
                    "date":pd.to_datetime(ts,unit="s",utc=True).tz_convert("Europe/Warsaw").normalize().tz_localize(None),
                    "close":q.get("close"),"volume":q.get("volume")
                  }).drop_duplicates("date").set_index("date").sort_index()
                  data=data.loc[:signal_date].dropna(subset=["close"])
                  if len(data)<253: continue
                  close=float(data["close"].iloc[-1])
                  sma200=float(data["close"].tail(200).mean())
                  mom12=float(close/data["close"].iloc[-253]-1)
                  adv60=float((data["close"].tail(60)*data["volume"].tail(60)).median())
                  rows.append({
                    "company_name":r["company_name"],"isin":r["isin"],"symbol":sym,
                    "date":str(data.index[-1].date()),"close":close,"sma200":sma200,
                    "mom12":mom12,"adv60_pln":adv60,
                    "trend_ok":bool(close>sma200 and mom12>0 and adv60>=1_000_000),
                    "current_wig_share_pct":r["index_share_pct"],
                  })
              except Exception as e:
                  print("PRICE_ERR",sym,r["company_name"],repr(e))
              time.sleep(.04)

          sc=pd.DataFrame(rows)
          sc.to_csv(OUT/"current_live_screen.csv",index=False)
          elig=sc[sc["trend_ok"]].sort_values("mom12",ascending=False).head(10).copy()
          capital=10000.0; slot=1000.0
          elig["shares"]=(slot/elig["close"]).apply(math.floor).astype(int)
          elig["notional_pln"]=elig["shares"]*elig["close"]
          elig["rounding_cash_pln"]=slot-elig["notional_pln"]
          invested=float(elig["notional_pln"].sum())
          result={
            "universe_source":"Money.pl / NOTORIA current WIG page",
            "universe_retrieved_for_run":"2026-09-29",
            "signal_date":"2026-09-28",
            "current_wig_members":int(len(mp)),
            "mapped_members":int(maps["symbol"].notna().sum()),
            "screened_with_253_sessions":int(len(sc)),
            "eligible_count":int(sc["trend_ok"].sum()),
            "selected_count":int(len(elig)),
            "starting_capital_pln":capital,
            "slot_pln":slot,
            "invested_before_costs_pln":invested,
            "cash_before_costs_pln":capital-invested,
            "selected":elig.to_dict(orient="records")
          }
          with open(OUT/"top10_current_signal.json","w",encoding="utf-8") as f:
              json.dump(result,f,indent=2,ensure_ascii=False)
          elig.to_csv(OUT/"top10_current_orders.csv",index=False)
          print(json.dumps(result,indent=2,ensure_ascii=False))
          PY

      - name: Commit signal
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "chatgpt-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f live_signal_current/
          git commit -m "research: add current WIG Top10 signal 2026-09-28" || true
          git fetch origin chatgpt-gpw-research
          git rebase origin/chatgpt-gpw-research
          git push origin HEAD:chatgpt-gpw-research
