name: Price current Top10 execution basket

on:
  push:
    branches: [chatgpt-gpw-research]
    paths:
      - ".github/workflows/price-current-top10.yml"

permissions:
  contents: write

jobs:
  price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-gpw-research
      - name: Fetch current Yahoo quotes and size 10k basket
        shell: bash
        run: |
          pip install requests pandas
          python - <<'PY'
          import requests, json, math
          from pathlib import Path
          picks=[
            ("ASBIS","ASB.WA"),("Digital Network","DIG.WA"),("Creotech","CRI.WA"),
            ("KGHM","KGH.WA"),("XTB","XTB.WA"),("Pepco","PCO.WA"),
            ("PKO BP","PKO.WA"),("GPW","GPW.WA"),("Orlen","PKN.WA"),
            ("Erste Bank Polska","EBP.WA")
          ]
          s=requests.Session(); s.headers.update({"User-Agent":"Mozilla/5.0"})
          rows=[]
          for name,sym in picks:
              r=s.get(f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}",
                      params={"range":"1d","interval":"1m"},timeout=20)
              r.raise_for_status()
              meta=r.json()["chart"]["result"][0]["meta"]
              price=float(meta.get("regularMarketPrice"))
              q=math.floor(1000/price)
              rows.append({"company":name,"symbol":sym,"current_price":price,"shares_for_1000_cap":q,
                           "notional":q*price,"headroom":1000-q*price,
                           "market_time":meta.get("regularMarketTime")})
          invested=sum(x["notional"] for x in rows)
          out={"capital":10000,"slot":1000,"invested":invested,"cash_before_costs":10000-invested,"rows":rows}
          Path("live_signal_current/top10_execution_quotes.json").write_text(json.dumps(out,indent=2,ensure_ascii=False))
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
      - name: Commit quotes
        shell: bash
        run: |
          git config user.name "chatgpt-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f live_signal_current/top10_execution_quotes.json
          git commit -m "research: price current Top10 execution basket" || true
          git fetch origin chatgpt-gpw-research
          git rebase origin/chatgpt-gpw-research
          git push origin HEAD:chatgpt-gpw-research
